worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    # Long JWT in WebSocket request line (query param) can exceed default buffers.
    large_client_header_buffers 4 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream core_upstream {
        server core:8000;
        keepalive 32;
    }

    upstream game_upstream {
        server game:8005;
        keepalive 32;
    }

    # WebSocket upgrades must not reuse pooled HTTP keepalive connections to the game
    # service; that pattern often breaks the upgrade handshake.
    upstream game_ws_upstream {
        server game:8005;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx/health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location /static/ {
            alias /var/www/core/static/;
            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        location /media/ {
            alias /var/www/core/media/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /api/game/ {
            proxy_pass http://game_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://game_ws_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
