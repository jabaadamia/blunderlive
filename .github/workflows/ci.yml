name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  game-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate JWT keypair for tests
        run: |
          mkdir -p ../../infra/dev-jwt
          openssl genrsa -out ../../infra/dev-jwt/private.pem 2048
          openssl rsa -in ../../infra/dev-jwt/private.pem -pubout -out ../../infra/dev-jwt/public.pem

      - name: Test
        env:
          REDIS_URL: redis://localhost:6379/0
          GAME_JWT_PUBLIC_KEY_PATH: ../../infra/dev-jwt/public.pem
        run: pytest

  core-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blunderlive_core
          POSTGRES_USER: blunderlive
          POSTGRES_PASSWORD: blunderlive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blunderlive -d blunderlive_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate JWT keypair for checks and tests
        run: |
          mkdir -p ../../infra/dev-jwt
          openssl genrsa -out ../../infra/dev-jwt/private.pem 2048
          openssl rsa -in ../../infra/dev-jwt/private.pem -pubout -out ../../infra/dev-jwt/public.pem

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          CORE_SECRET_KEY: ci-secret-key
          CORE_DATABASE_URL: postgresql://blunderlive:blunderlive@localhost:5432/blunderlive_core
          CORE_JWT_PRIVATE_KEY_PATH: ../../infra/dev-jwt/private.pem
          CORE_JWT_PUBLIC_KEY_PATH: ../../infra/dev-jwt/public.pem
        run: python manage.py check

      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          CORE_SECRET_KEY: ci-secret-key
          CORE_DATABASE_URL: postgresql://blunderlive:blunderlive@localhost:5432/blunderlive_core
          CORE_JWT_PRIVATE_KEY_PATH: ../../infra/dev-jwt/private.pem
          CORE_JWT_PUBLIC_KEY_PATH: ../../infra/dev-jwt/public.pem
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - frontend
          - game
          - core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: false
