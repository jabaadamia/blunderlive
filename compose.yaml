services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
    - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CORE_SECRET_KEY: ${CORE_SECRET_KEY}
      CORE_DEBUG: ${CORE_DEBUG}
      CORE_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "${CORE_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      GAME_PORT: ${GAME_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_URL: ${REDIS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GAME_PORT}:8005"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_CORE_API_BASE_URL: ${NEXT_PUBLIC_CORE_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_GAME_API_BASE_URL: ${NEXT_PUBLIC_GAME_API_BASE_URL:-http://localhost:8005}
      INTERNAL_CORE_URL: ${INTERNAL_CORE_URL:-http://core:8000}
      INTERNAL_GAME_URL: ${INTERNAL_GAME_URL:-http://game:8005}
    # Override to use dev server locally; remove this command in production
    command: ["node_modules/.bin/next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      core:
        condition: service_healthy
      game:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      core:
        condition: service_healthy
      game:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next_cache:
