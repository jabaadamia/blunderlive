services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      CORE_SECRET_KEY: ${CORE_SECRET_KEY}
      CORE_JWT_PRIVATE_KEY_PATH: ${CORE_JWT_PRIVATE_KEY_PATH}
      CORE_JWT_PUBLIC_KEY_PATH: ${CORE_JWT_PUBLIC_KEY_PATH}
      CORE_DEBUG: ${CORE_DEBUG:-False}
      CORE_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORE_GAMES_FINISHED_STREAM: ${CORE_GAMES_FINISHED_STREAM:-games.finished}
      CORE_GAMES_PROCESSED_STREAM: ${CORE_GAMES_PROCESSED_STREAM:-games.processed}
      CORE_GAMES_FAILED_STREAM: ${CORE_GAMES_FAILED_STREAM:-games.failed}
      CORE_GAMES_CONSUMER_GROUP: ${CORE_GAMES_CONSUMER_GROUP:-core-game-processing}
      CORE_CSRF_TRUSTED_ORIGINS: ${CORE_CSRF_TRUSTED_ORIGINS:-}
      CORE_SECURE_COOKIES: ${CORE_SECURE_COOKIES:-False}
      CORE_SECURE_SSL_REDIRECT: ${CORE_SECURE_SSL_REDIRECT:-False}
      CORE_SECURE_HSTS_SECONDS: ${CORE_SECURE_HSTS_SECONDS:-0}
      CORE_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${CORE_SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      CORE_SECURE_HSTS_PRELOAD: ${CORE_SECURE_HSTS_PRELOAD:-False}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    command:
      - sh
      - -c
      - gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers "${GUNICORN_WORKERS:-3}" --timeout "${GUNICORN_TIMEOUT:-60}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - core_static:/app/staticfiles
      - core_media:/app/media
      - ./infra/dev-jwt:/run/dev-jwt:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  core-worker:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      CORE_SECRET_KEY: ${CORE_SECRET_KEY}
      CORE_JWT_PRIVATE_KEY_PATH: ${CORE_JWT_PRIVATE_KEY_PATH}
      CORE_JWT_PUBLIC_KEY_PATH: ${CORE_JWT_PUBLIC_KEY_PATH}
      CORE_DEBUG: ${CORE_DEBUG:-False}
      CORE_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CORE_GAMES_FINISHED_STREAM: ${CORE_GAMES_FINISHED_STREAM:-games.finished}
      CORE_GAMES_PROCESSED_STREAM: ${CORE_GAMES_PROCESSED_STREAM:-games.processed}
      CORE_GAMES_FAILED_STREAM: ${CORE_GAMES_FAILED_STREAM:-games.failed}
      CORE_GAMES_CONSUMER_GROUP: ${CORE_GAMES_CONSUMER_GROUP:-core-game-processing}
    command:
      - python
      - manage.py
      - process_finished_games
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./infra/dev-jwt:/run/dev-jwt:ro

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      GAME_PORT: ${GAME_PORT:-8005}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL}
      CORE_GAMES_FINISHED_STREAM: ${CORE_GAMES_FINISHED_STREAM:-games.finished}
      CORE_GAMES_PROCESSED_STREAM: ${CORE_GAMES_PROCESSED_STREAM:-games.processed}
      GAME_GAMES_PROCESSED_CONSUMER_GROUP: ${GAME_GAMES_PROCESSED_CONSUMER_GROUP:-game-rating-updates}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      GAME_JWT_PUBLIC_KEY_PATH: ${GAME_JWT_PUBLIC_KEY_PATH}
      CORE_API_BASE_URL: ${CORE_API_BASE_URL:-http://core:8000}
    expose:
      - "8005"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./infra/dev-jwt:/run/dev-jwt:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_CORE_API_BASE_URL: ${NEXT_PUBLIC_CORE_API_BASE_URL:-/api}
        NEXT_PUBLIC_GAME_API_BASE_URL: ${NEXT_PUBLIC_GAME_API_BASE_URL:-/api/game}
        INTERNAL_CORE_URL: ${INTERNAL_CORE_URL:-http://core:8000}
        INTERNAL_GAME_URL: ${INTERNAL_GAME_URL:-http://game:8005}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_CORE_API_BASE_URL: ${NEXT_PUBLIC_CORE_API_BASE_URL:-/api}
      NEXT_PUBLIC_GAME_API_BASE_URL: ${NEXT_PUBLIC_GAME_API_BASE_URL:-/api/game}
      INTERNAL_CORE_URL: ${INTERNAL_CORE_URL:-http://core:8000}
      INTERNAL_GAME_URL: ${INTERNAL_GAME_URL:-http://game:8005}
    expose:
      - "3000"
    depends_on:
      core:
        condition: service_healthy
      game:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      core:
        condition: service_healthy
      game:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - core_static:/var/www/core/static:ro
      - core_media:/var/www/core/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  core_static:
  core_media:
